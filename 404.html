<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Parvez Ahmed</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#161513">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&display=swap" rel="stylesheet">
  <style>
    /* Cloudflare Pages serves this for any address without a page, at any
       depth, so it carries its own styles and links from the root. It is the
       homepage's night, at the hour nothing is open. */

    :root {
      --night: #161513;
      --moon: #e7e9ee;
      --moon-soft: #9a978f;
      --sodium: #f5a524;
      --gutter: clamp(16px, 4vw, 56px);
      /* No system-ui: on Android that resolves to Roboto. */
      --font: "Mona Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      background: var(--night);
      color: var(--moon);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--night);
      font-family: var(--font);
      font-size: clamp(1.0625rem, 1rem + .25vw, 1.1875rem);
      line-height: 1.5;
      font-kerning: normal;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }

    :focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
      border-radius: 2px;
    }

    .bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 2rem;
      padding: 18px var(--gutter);
      font-size: .9375rem;
      line-height: 1.2;
    }

    .bar-name { font-weight: 600; font-stretch: 112%; }
    .bar-clock { font-weight: 500; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 0 var(--gutter) clamp(28px, 5vh, 48px);
    }

    h1 {
      margin: 0;
      font-size: clamp(8rem, 56vw, 26rem);
      font-stretch: 75%;
      font-weight: 500;
      line-height: .8;
      letter-spacing: -.035em;
    }

    p {
      margin: clamp(24px, 4vh, 40px) 0 0;
      color: var(--moon-soft);
    }

    .home {
      margin-top: 8px;
      font-size: 1.125rem;
      background: linear-gradient(var(--sodium), var(--sodium)) 0 100% / 0 2px no-repeat;
      transition: background-size .5s var(--ease), color .3s;
    }

    .home:hover,
    .home:focus-visible {
      color: var(--sodium);
      background-size: 100% 2px;
    }

    @media (prefers-reduced-motion: no-preference) {
      h1, p, .home { animation: rise 1.1s var(--ease) backwards; }
      p { animation-delay: .12s; }
      .home { animation-delay: .2s; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(.35em); }
    }
  </style>
</head>
<body>

  <header class="bar">
    <a class="bar-name" href="/">Parvez Ahmed</a>
    <span class="bar-clock" aria-hidden="true">03:00</span>
  </header>

  <main>
    <h1>404</h1>
    <p>Nothing here.</p>
    <a class="home" href="/">Back to morning</a>
  </main>

</body>
</html>
